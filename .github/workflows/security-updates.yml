name: Security Patch Update

on:
  schedule:
    # Runs at 03:00 AM UTC every day
    - cron: '0 3 * * *'
  workflow_dispatch: # Allows you to run it manually for testing

jobs:
  update-vulnerabilities:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20' # Change to your project's version
          cache: 'npm'

      - name: Install dependencies
        run: npm install

      - name: Fix high and critical vulnerabilities
        # --audit-level=high ensures we focus on High and Critical
        # fix --force will attempt to upgrade packages to the next compatible version
        run: npm audit fix --audit-level=high

      - name: Commit and Push changes
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "chore: security update for high/critical vulnerabilities"
          file_pattern: 'package.json package-lock.json'
          commit_user_name: "github-actions[bot]"
          commit_user_email: "github-actions[bot]@users.noreply.github.com"